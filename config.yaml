# Configuração do bot de ofertas (o que não é segredo fica aqui; segredos vão no .env)

geral:
  intervalo_minutos: 30        # de quanto em quanto tempo buscar ofertas novas
  max_posts_por_ciclo: 0       # teto de posts por canal em cada rodada; 0 = sem limite (posta enquanto houver oferta válida)
  espacamento_segundos: 300    # ritmo: cada canal recebe um post a cada N segundos (300 = 5 min); com vários canais eles se intercalam
  variacao_espacamento: 25     # o intervalo varia até ±25% (mais natural que um relógio); 0 = intervalo exato
  nao_repetir_dias: 7          # não repostar o mesmo produto dentro desse prazo
  horario_ativo: "07:00-23:30" # só posta nesse intervalo (hora do PC); "" = 24h
  link_visivel: true           # mostra também o link escrito no texto do post ("Compre aqui: ..."), além do botão
  aviso_amazon: "Como participante do Programa de Associados da Amazon, sou remunerado pelas compras qualificadas efetuadas."
                               # frase exigida pelo contrato da Amazon; vai no fim dos posts da Amazon. "" = desliga
  relatorio_hora: "21:00"      # hora em que o bot manda o relatório do dia no seu privado; "" = desliga

filtros:
  desconto_minimo: 25          # % mínimo de desconto para postar (ofertas automáticas)
  desconto_maximo: 85          # acima disso o desconto é suspeito (preço "de" inflado) e o produto é ignorado; 0 = sem limite
  nota_minima: 4.3             # só posta produto com avaliação >= isto (quando a loja informa a nota); 0 = ignora
  vendas_minimas: 30           # só posta produto com >= N vendas (quando a loja informa); 0 = ignora
  preco_minimo: 0              # 0 = sem limite
  preco_maximo: 0              # 0 = sem limite
  palavras_bloqueadas: []      # ex.: [capinha, película] — ignora ofertas com essas palavras

# Por padrão o bot pega ofertas de TODAS as categorias.
# JEITO FÁCIL de escolher um nicho: crie um canal na seção "Canais" do PAINEL e marque os nichos
# (isso substitui as listas abaixo, sem editar este arquivo).
# JEITO MANUAL/AVANÇADO: preencha as listas abaixo (veja os exemplos comentados).
fontes:
  mercadolivre:
    ativa: true
    paginas: 1                 # páginas de mercadolivre.com.br/ofertas por categoria (~48 itens cada)
    requisicoes_por_ciclo: 12  # rodízio: quantas categorias consultar por rodada (0 = todas de uma vez)
    buscas_api_por_ciclo: 6    # com a API oficial (ML_APP_ID/SECRET): quantas palavras-chave buscar por rodada
    categorias: {}             # vazio = todas as categorias.
    # Para um nicho, troque por (id: nome). Exemplos de categorias do Mercado Livre:
    #   MLB1648: Informática
    #   MLB1000: Eletrônicos, Áudio e Vídeo
    #   MLB1051: Celulares e Telefones
    #   MLB1276: Esportes e Fitness
    #   MLB1574: Casa, Móveis e Decoração
    #   MLB1430: Roupas e Acessórios
    #   MLB1132: Brinquedos e Hobbies
    #   MLB1246: Beleza e Cuidado Pessoal

  amazon:
    ativa: true
    paginas: 1                 # páginas por listagem de ofertas (~24-48 itens cada)
    requisicoes_por_ciclo: 4   # rodízio: quantas páginas de busca por ciclo (0 = todas de uma vez)
    departamentos: {}          # vazio = ofertas de todas as categorias.
    # Para um nicho, troque por (alias: nome). Exemplos de departamentos da Amazon:
    #   electronics: Eletrônicos
    #   computers: Computadores e Informática
    #   home: Casa
    #   kitchen: Cozinha
    #   sporting: Esportes
    #   toys: Brinquedos
    #   beauty: Beleza
    #   fashion: Moda
    buscas: []                 # termos livres extras, ex.: [echo dot, air fryer]

  shopee:
    ativa: true
    limite: 40                 # total de produtos pedidos à Open API por ciclo
    buscas: []                 # vazio = ofertas em destaque da Shopee (todas as categorias).
    # Para um nicho, liste palavras-chave, ex.:
    #   - fone bluetooth
    #   - tênis
    #   - panela
